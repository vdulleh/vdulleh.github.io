<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Chatbot UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./app.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-100 font-sans text-zinc-900">
  <main class="relative flex min-h-screen items-center justify-center px-6 py-20">
    <section class="max-w-3xl text-center">
    

    <div class="fixed bottom-6 right-6 z-50">
      <input id="chat-toggle" type="checkbox" class="peer sr-only">

      <div class="pointer-events-none mb-4 w-[18rem] translate-y-4 rounded-[2rem] border border-zinc-200 bg-white/95 opacity-0 shadow-2xl shadow-zinc-400/20 transition-all duration-300 peer-checked:pointer-events-auto peer-checked:translate-y-0 peer-checked:opacity-100 sm:w-[19rem]">
        <div class="rounded-t-[2rem] border-b border-zinc-200 bg-zinc-950 px-5 py-4 text-zinc-50">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-sm font-medium text-zinc-300">AI Assistant</p>
              <h2 class="mt-1 text-lg font-semibold">How can we help?</h2>
            </div>
            <label for="chat-toggle" class="cursor-pointer rounded-full border border-zinc-400 p-2 text-zinc-300 transition hover:bg-zinc-800 hover:text-white" aria-label="Close chat">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
              </svg>
            </label>
          </div>
          <p class="mt-3 text-sm leading-6 text-zinc-400">
            Instant answers for product questions, pricing, and onboarding.
          </p>
        </div>

        <div id="chat-messages" class="max-h-72 space-y-4 overflow-y-auto px-4 py-5">
        

         
        </div>

        <div class="border-t border-zinc-200 px-4 py-4">
          <div class="flex items-end gap-3 rounded-2xl border border-zinc-300 bg-zinc-50 px-3 py-3">
            <div class="min-h-[24px] flex-1 text-sm text-zinc-400">
              Type your message...
            </div>
            <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-zinc-900 text-white transition hover:bg-zinc-700" aria-label="Send message">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3.4 20.4 21 12 3.4 3.6l1.8 6.8L15 12l-9.8 1.6-1.8 6.8Z" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <label for="chat-toggle" class="flex cursor-pointer items-center gap-3 rounded-full border border-zinc-900 bg-zinc-950 px-4 py-3 text-white shadow-xl shadow-zinc-400/30 transition hover:bg-zinc-800 peer-checked:scale-95">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-zinc-950">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m6 6-3.8-2.3a3 3 0 0 0-1.5-.4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-2 3.5V20Z" />
          </svg>
        </span>
        <span class="pr-1 text-sm font-medium">How can I help</span>
      </label>
    </div>
  </main>
</body>
</html>
